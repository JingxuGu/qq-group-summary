[program:qq-group-summary]
directory=/opt/qq-group-summary
command=/opt/qq-group-summary/.venv/bin/python -m app.main
environment=QQ_DAILY_CONFIG="/opt/qq-group-summary/config.yaml",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/qq-group-summary/logs/supervisor-stdout.log
stderr_logfile=/opt/qq-group-summary/logs/supervisor-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=7
stderr_logfile_backups=7
