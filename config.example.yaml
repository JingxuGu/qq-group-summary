# Template only. The startup script copies this to config.yaml; keep real settings out of this file.
app:
  timezone: Asia/Shanghai
  daily_email_time: "22:30"
  host: 127.0.0.1
  port: 8765
  napcat_webui_url: http://127.0.0.1:6099/webui
storage:
  database: ./data/qq_summary.db
  raw_message_retention_days: 14
logging:
  directory: ./logs
  retention_days: 14
llm:
  primary:
    provider: qwen
    model: qwen3.5-flash
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: QWEN_API_KEY
    retries: 2
  fallback:
    provider: glm
    model: glm-4.7-flashx
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: GLM_API_KEY
    retries: 1
summary_policy:
  academic: {max_messages: 400, idle_minutes: 60, max_window_hours: 4}
  course: {max_messages: 150, idle_minutes: 30, max_window_hours: 2}
  casual: {max_messages: 500, idle_minutes: 90, max_window_hours: 6}
email:
  provider: mailjet
  default_to_address: you@example.com
mailjet:
  api_base_url: https://api.mailjet.com/v3.1
  from_address: verified-sender@example.com
  from_name: QQ Group Summary
  reply_to_address: ""
# Optional fallback. Change email.provider to smtp to use it.
smtp:
  host: smtp.example.com
  port: 465
  use_ssl: true
  starttls: false
  from_address: you@example.com
  to_address: you@example.com
